<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090d1b">
  <title>TinVin AI</title>

  <link rel="stylesheet" href="style.css?v=20261111">
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="translator.css">
  <link rel="stylesheet" href="qr.css">
  <link rel="stylesheet" href="premium.css">
  <link rel="stylesheet" href="redesign.css?v=20261111">
  <link rel="stylesheet" href="home.css?v=1">
</head>

<body>
<div class="app-shell">

  <header class="topbar">
    <button class="menu-toggle" id="menuToggle"
      type="button" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <div class="brand">
      <span class="brand-icon">✧</span>
      <span>TinVin AI</span>
    </div>

    <button id="premiumTopBtn" class="premium-top-btn"
      type="button" onclick="window.TinVinPremium?.open()">
      ♛ Premium
    </button>
  </header>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <aside class="sidebar" id="mainSidebar">
    <div class="sidebar-header">
      <span>Workspace</span>
      <button id="closeMenu" type="button" aria-label="Close menu">×</button>
    </div>

    <nav class="sidebar-menu">
      <button class="menu-item" type="button" data-menu="profile">
        <span>◉</span> Profile
      </button>

      <button class="menu-item" id="settingsBtn" type="button">
        <span>⚙</span> Settings
      </button>

      <button class="menu-item" type="button" data-menu="history">
        <span>◷</span> History
      </button>

      <button class="menu-item" type="button" data-menu="messages">
        <span>✉</span> Messages
      </button>
    </nav>

    <div class="sidebar-bottom">
      <span>✦ TinVin AI</span>
      <small>Your AI workspace</small>
    </div>
  </aside>

  <main id="workspacePage" class="page active">

    <!-- HOME -->
    <section id="homePanel" class="workspace-panel active">
      <div class="home-title">
        <span class="home-logo">✧</span>
        <h1>TinVin AI</h1>
      </div>

      <div class="home-menu">
        <button class="glass-btn" type="button" data-open="chat">
          <span class="glass-icon">✧</span>
          <span>AI Chat</span>
        </button>

        <button class="glass-btn" type="button" data-open="translator">
          <span class="glass-icon">◎</span>
          <span>Translate</span>
        </button>

        <button class="glass-btn" type="button" data-open="qr">
          <span class="glass-icon">▦</span>
          <span>Scanner</span>
        </button>

        <div class="home-row">
          <button class="glass-btn gold" id="homePremiumBtn" type="button">
            <span class="glass-icon">♛</span>
            <span>Premium</span>
          </button>

          <button class="glass-btn small" id="homeSettingsBtn" type="button">
            <span class="glass-icon">⚙</span>
            <span>Settings</span>
          </button>
        </div>
      </div>

      <div class="home-bar">
        <button class="home-bar-btn" id="homeMicBtn" type="button"
          aria-label="Voice input">🎤</button>
        <button class="home-bar-btn" id="homeImageBtn" type="button"
          aria-label="Add image">🖼</button>
        <input id="homeInput" class="home-input" type="text"
          placeholder="Type your prompt here..." enterkeyhint="send">
        <button class="home-send" id="homeSendBtn" type="button"
          aria-label="Send">↑</button>
      </div>

      <div id="homeStatus" class="status"></div>
    </section>

    <!-- AI CHAT -->
    <section id="chatPage" class="workspace-panel" hidden>
      <div class="tool-heading">
        <h2>✧ AI Chat</h2>
        <p>Your intelligent assistant</p>
      </div>

      <div class="chat-layout">
        <div id="chatHistory" class="chat-history"></div>

        <div class="chat-compose">
          <textarea id="chatInput" class="textarea"
            placeholder="Message TinVin AI..." rows="2"></textarea>

          <button id="sendBtn" class="primary-btn" type="button">↑</button>
        </div>

        <div id="chatStatus" class="status"></div>

        <button id="newChatBtn" class="secondary-btn" type="button">
          + New Chat
        </button>
      </div>
    </section>

    <!-- TRANSLATE -->
    <section id="translatorPage" class="workspace-panel" hidden>
      <div class="tool-heading">
        <h2>◎ AI Translator</h2>
        <p>Translate naturally between languages</p>
      </div>

      <div class="translator-languages">
        <select id="translatorSourceLang" class="select"></select>
        <select id="translatorTargetLang" class="select"></select>
      </div>

      <div id="translatorHistory" class="translator-history"></div>

      <div class="translator-compose">
        <textarea id="translatorInput" class="textarea"
          placeholder="Write something to translate..." rows="3"></textarea>

        <button id="translatorRunBtn" class="primary-btn" type="button">
          Translate ↑
        </button>

        <button id="translatorClearBtn" class="secondary-btn" type="button">
          Clear
        </button>

        <div id="translatorStatus" class="status"></div>
      </div>
    </section>

    <!-- SCANNER -->
    <section id="scannerPanel" class="workspace-panel" hidden>
      <div class="tool-heading">
        <h2>▦ QR Scanner</h2>
        <p>Scan and create QR codes</p>
      </div>

      <button id="openScannerBtn" class="primary-btn" type="button">
        Open Scanner
      </button>
    </section>

  </main>

  <section id="settingsPage" class="page">
    <button id="settingsBackBtn" class="back-btn" type="button">
      ← Back
    </button>

    <div class="settings-heading">
      <div class="eyebrow">PERSONALIZE YOUR EXPERIENCE</div>
      <h1>⚙ Settings</h1>
      <p>Make TinVin AI yours.</p>
    </div>

    <div class="settings-grid">
      <div class="panel">
        <label for="themeSelect">Theme</label>

        <select id="themeSelect" class="select">
          <option value="black">Black</option>
          <option value="navy">Navy Gold</option>
          <option value="blue">Blue</option>
          <option value="purple">Purple</option>
          <option value="green">Green</option>
          <option value="pink">Pink</option>
          <option value="orange">Orange</option>
        </select>
      </div>

      <div class="panel">
        <label for="interfaceLang">Interface Language</label>

        <select id="interfaceLang" class="select">
          <option value="English">English</option>
          <option value="Sorani Kurdish">کوردیی سۆرانی</option>
          <option value="Kurmanji Kurdish">Kurdî Kurmancî</option>
          <option value="Arabic">العربية</option>
          <option value="Turkish">Türkçe</option>
          <option value="Persian">فارسی</option>
        </select>

        <div id="languageStatus" class="status"></div>
      </div>
    </div>
  </section>

</div>

<script src="app.js" defer></script>
<script src="chat.js?v=20261104-2" defer></script>
<script src="translator.js" defer></script>
<script src="qr.js" defer></script>
<script src="premium.js" defer></script>
<script src="home.js?v=1" defer></script>
<script type="module" src="cloud.js?v=1"></script>

</body>
</html>
