<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090d1b">
  <title>TinVin AI</title>
   
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TinVin AI">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css?v=20261111">
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="translator.css">
  <link rel="stylesheet" href="qr.css">
  <link rel="stylesheet" href="premium.css">
  <link rel="stylesheet" href="redesign.css?v=20261111">
  <link rel="stylesheet" href="home.css?v=1">
</head>

<body>
<div class="app-shell">

  <header class="topbar">
    <button class="menu-toggle" id="menuToggle"
      type="button" aria-label="Open menu">
      <span></span><span></span><span></span>
    </button>

    <div class="brand">
      <span class="brand-icon">✧</span>
      <span>TinVin AI</span>
    </div>

    <button id="premiumTopBtn" class="premium-top-btn"
      type="button" onclick="window.TinVinPremium?.open()">
      ♛ Premium
    </button>
  </header>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <aside class="sidebar" id="mainSidebar">
    <div class="sidebar-header">
      <span>Workspace</span>
      <button id="closeMenu" type="button" aria-label="Close menu">×</button>
    </div>

    <nav class="sidebar-menu">
      <button class="menu-item" type="button" data-menu="profile">
        <span>◉</span> Profile
      </button>

      <button class="menu-item" id="settingsBtn" type="button">
        <span>⚙</span> Settings
      </button>

      <button class="menu-item" type="button" data-menu="history">
        <span>◷</span> History
      </button>

      <button class="menu-item" type="button" data-menu="messages">
        <span>✉</span> Messages
      </button>
    </nav>

    <div class="sidebar-bottom">
      <span>✦ TinVin AI</span>
      <small>Your AI workspace</small>
    </div>
  </aside>

  <main id="workspacePage" class="page active">

    <!-- HOME -->
    <section id="homePanel" class="workspace-panel active">
      <div class="home-title">
        <span class="home-logo">✧</span>
        <h1>TinVin AI</h1>
      </div>

      <div class="home-menu">
        <button class="glass-btn" type="button" data-open="chat">
          <span class="glass-icon">✧</span>
          <span>AI Chat</span>
        </button>

        <button class="glass-btn" type="button" data-open="translator">
          <span class="glass-icon">◎</span>
          <span>Translate</span>
        </button>

        <button class="glass-btn" type="button" data-open="qr">
          <span class="glass-icon">▦</span>
          <span>Scanner</span>
        </button>

        <div class="home-row">
          <button class="glass-btn gold" id="homePremiumBtn" type="button">
            <span class="glass-icon">♛</span>
            <span>Premium</span>
          </button>

          <button class="glass-btn small" id="homeSettingsBtn" type="button">
            <span class="glass-icon">⚙</span>
            <span>Settings</span>
          </button>
        </div>
      </div>

      <div class="home-bar">
        <button class="home-bar-btn" id="homeMicBtn" type="button"
          aria-label="Voice input">🎤</button>
        <button class="home-bar-btn" id="homeImageBtn" type="button"
          aria-label="Add image">🖼</button>
        <input id="homeInput" class="home-input" type="text"
          placeholder="Type your prompt here..." enterkeyhint="send">
        <button class="home-send" id="homeSendBtn" type="button"
          aria-label="Send">↑</button>
      </div>

      <div id="homeStatus" class="status"></div>
    </section>

    <!-- AI CHAT -->
    <section id="chatPage" class="workspace-panel" hidden>
      <div class="tool-heading">
        <h2>✧ AI Chat</h2>
        <p>Your intelligent assistant</p>
      </div>

      <div class="chat-layout">
        <div id="chatHistory" class="chat-history"></div>

        <div class="chat-compose">
          <textarea id="chatInput" class="textarea"
            placeholder="Message TinVin AI..." rows="2"></textarea>

          <button id="sendBtn" class="primary-btn" type="button">↑</button>
        </div>

        <div id="chatStatus" class="status"></div>

        <button id="newChatBtn" class="secondary-btn" type="button">
          + New Chat
        </button>
      </div>
    </section>

    <!-- TRANSLATE -->
    <section id="translatorPage" class="workspace-panel" hidden>
      <div class="tool-heading">
        <h2>◎ AI Translator</h2>
        <p>Translate naturally between languages</p>
      </div>

      <div class="translator-languages">
        <select id="translatorSourceLang" class="select"></select>
        <select id="translatorTargetLang" class="select"></select>
      </div>

      <div id="translatorHistory" class="translator-history"></div>

      <div class="translator-compose">
        <textarea id="translatorInput" class="textarea"
          placeholder="Write something to translate..." rows="3"></textarea>

        <button id="translatorRunBtn" class="primary-btn" type="button">
          Translate ↑
        </button>

        <button id="translatorClearBtn" class="secondary-btn" type="button">
          Clear
        </button>

        <div id="translatorStatus" class="status"></div>
      </div>
    </section>

    <!-- SCANNER -->
    <section id="scannerPanel" class="workspace-panel" hidden>
      <div class="tool-heading">
        <h2>▦ QR Scanner</h2>
        <p>Scan and create QR codes</p>
      </div>

      <button id="openScannerBtn" class="primary-btn" type="button">
        Open Scanner
      </button>
    </section>

  </main>

  <section id="settingsPage" class="page">
    <button id="settingsBackBtn" class="back-btn" type="button">
      ← Back
    </button>

    <div class="settings-heading">
      <div class="eyebrow">PERSONALIZE YOUR EXPERIENCE</div>
      <h1>⚙ Settings</h1>
      <p>Make TinVin AI yours.</p>
    </div>

    <div class="settings-grid">
      <div class="panel">
        <label for="themeSelect">Theme</label>

        <select id="themeSelect" class="select">
          <option value="black">Black</option>
          <option value="navy">Navy Gold</option>
          <option value="blue">Blue</option>
          <option value="purple">Purple</option>
          <option value="green">Green</option>
          <option value="pink">Pink</option>
          <option value="orange">Orange</option>
        </select>
      </div>

      <div class="panel">
        <label for="interfaceLang">Interface Language</label>

        <select id="interfaceLang" class="select">
          <option value="English">English</option>
          <option value="Sorani Kurdish">کوردیی سۆرانی</option>
          <option value="Kurmanji Kurdish">Kurdî Kurmancî</option>
          <option value="Arabic">العربية</option>
          <option value="Persian">فارسی</option>
          <option value="Turkish">Türkçe</option>
          <option value="Spanish">Español</option>
          <option value="French">Français</option>
          <option value="German">Deutsch</option>
          <option value="Italian">Italiano</option>
          <option value="Portuguese">Português</option>
          <option value="Brazilian Portuguese">Português (Brasil)</option>
          <option value="Russian">Русский</option>
          <option value="Ukrainian">Українська</option>
          <option value="Polish">Polski</option>
          <option value="Dutch">Nederlands</option>
          <option value="Swedish">Svenska</option>
          <option value="Norwegian">Norsk</option>
          <option value="Danish">Dansk</option>
          <option value="Finnish">Suomi</option>
          <option value="Greek">Ελληνικά</option>
          <option value="Romanian">Română</option>
          <option value="Hungarian">Magyar</option>
          <option value="Czech">Čeština</option>
          <option value="Slovak">Slovenčina</option>
          <option value="Bulgarian">Български</option>
          <option value="Serbian">Српски</option>
          <option value="Croatian">Hrvatski</option>
          <option value="Bosnian">Bosanski</option>
          <option value="Albanian">Shqip</option>
          <option value="Macedonian">Македонски</option>
          <option value="Armenian">Հայերեն</option>
          <option value="Georgian">ქართული</option>
          <option value="Azerbaijani">Azərbaycan</option>
          <option value="Kazakh">Қазақша</option>
          <option value="Uzbek">O‘zbekcha</option>
          <option value="Turkmen">Türkmençe</option>
          <option value="Pashto">پښتو</option>
          <option value="Urdu">اردو</option>
          <option value="Hindi">हिन्दी</option>
          <option value="Bengali">বাংলা</option>
          <option value="Punjabi">ਪੰਜਾਬੀ</option>
          <option value="Gujarati">ગુજરાતી</option>
          <option value="Marathi">मराठी</option>
          <option value="Tamil">தமிழ்</option>
          <option value="Telugu">తెలుగు</option>
          <option value="Malayalam">മലയാളം</option>
          <option value="Kannada">ಕನ್ನಡ</option>
          <option value="Nepali">नेपाली</option>
          <option value="Sinhala">සිංහල</option>
          <option value="Thai">ไทย</option>
          <option value="Vietnamese">Tiếng Việt</option>
          <option value="Indonesian">Bahasa Indonesia</option>
          <option value="Malay">Bahasa Melayu</option>
          <option value="Filipino">Filipino</option>
          <option value="Khmer">ខ្មែរ</option>
          <option value="Lao">ລາວ</option>
          <option value="Burmese">မြန်မာ</option>
          <option value="Mongolian">Монгол</option>
          <option value="Chinese Simplified">简体中文</option>
          <option value="Chinese Traditional">繁體中文</option>
          <option value="Japanese">日本語</option>
          <option value="Korean">한국어</option>
          <option value="Swahili">Kiswahili</option>
          <option value="Amharic">አማርኛ</option>
          <option value="Somali">Soomaali</option>
          <option value="Hausa">Hausa</option>
          <option value="Yoruba">Yorùbá</option>
          <option value="Zulu">isiZulu</option>
          <option value="Afrikaans">Afrikaans</option>
        </select>

        <div id="languageStatus" class="status"></div>
      </div>
    </div>
  </section>

</div>

<script src="app.js" defer></script>
<script src="chat.js?v=20261104-2" defer></script>
<script src="translator.js" defer></script>
<script src="qr.js" defer></script>
<script src="upgrade.js?v=1" defer></script>
<script src="home.js?v=1" defer></script>
<script src="composer.js?v=1" defer></script>
<script type="module" src="cloud.js?v=1"></script>

</body>
</html>
