
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>TinVin AI — Smart Workspace</title>
<style>
:root{--bg:#0b1020;--panel:#121a30;--line:#293657;--text:#f5f7ff;--muted:#aab5d0;--blue:#51b8ff;--gold:#e9bd63;--purple:#8b70ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#18264a 0%,var(--bg) 55%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.wrap{width:min(1100px,100%);margin:auto;padding:22px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:21px}
.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#fff0b7);color:#11182b;font-weight:950}
.top select{max-width:220px}
.hero{padding:25px 0 24px}
.eyebrow{color:var(--gold);font-weight:750;font-size:12px;letter-spacing:2px;text-transform:uppercase}
.hero h1{font-size:clamp(32px,6vw,54px);line-height:1.08;margin:12px 0;background:linear-gradient(90deg,#fff,var(--gold),#83d2ff);-webkit-background-clip:text;background-clip:text;color:transparent;max-width:780px}
.hero p{color:var(--muted);max-width:650px;line-height:1.65;margin:0}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0 22px}
.tool{border:1px solid var(--line);background:linear-gradient(145deg,#17213b,#10182c);border-radius:17px;padding:16px;text-align:left;color:var(--text);min-height:108px;transition:.18s}
.tool:hover,.tool.active{border-color:var(--gold);transform:translateY(-1px);box-shadow:0 8px 26px #0003}
.tool.active{background:linear-gradient(145deg,#263453,#18233c)}
.tool .ico{font-size:23px;margin-bottom:9px}
.tool strong{display:block;font-size:14px}
.tool small{display:block;color:var(--muted);margin-top:5px;line-height:1.35}
.panel{border:1px solid var(--line);background:linear-gradient(145deg,#141e36ee,#0f1729f5);border-radius:22px;padding:clamp(16px,3vw,26px);box-shadow:0 18px 60px #0002}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}
.panel h2{font-size:21px;margin:0}
.pill{border:1px solid #4b456c;background:#221f42;color:#d8d0ff;border-radius:999px;padding:7px 11px;font-size:12px}
label{display:block;color:#d7def1;font-size:13px;font-weight:700;margin:14px 0 7px}
textarea,input,select{width:100%;color:var(--text);background:#0b1325;border:1px solid #33415f;border-radius:12px;padding:12px 13px;outline:none}
textarea{min-height:145px;resize:vertical;line-height:1.55}
textarea:focus,input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #51b8ff18}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px}
.primary,.secondary{border:0;border-radius:12px;padding:12px 17px;font-weight:800}
.primary{background:linear-gradient(100deg,var(--gold),#ffe8a6);color:#151a2a;min-width:140px}
.primary:disabled{opacity:.55;cursor:wait}
.secondary{background:#202c47;color:var(--text);border:1px solid #344361}
.status{color:var(--muted);font-size:13px;margin-top:12px;min-height:18px;overflow-wrap:anywhere}
.result{margin-top:21px;border-top:1px solid var(--line);padding-top:18px}
.result-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.result h3{margin:0;font-size:16px}
.output{white-space:pre-wrap;overflow-wrap:anywhere;color:#e9edfb;line-height:1.7;margin-top:12px;min-height:60px}
.output:empty:before{content:"Your result will appear here.";color:#7f8ca8}
.image-result{display:none;max-width:100%;border-radius:15px;margin-top:14px;border:1px solid var(--line)}
.foot{text-align:center;color:#74819d;font-size:12px;padding:22px 0 0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#26334e;border:1px solid #485b7d;border-radius:12px;padding:11px 15px;max-width:calc(100% - 24px);z-index:9;display:none;box-shadow:0 10px 40px #0006}
.hidden{display:none!important}
html[dir=rtl] .tool{text-align:right}
@media(max-width:760px){.tools{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.top{align-items:flex-start}.brand{font-size:18px}.wrap{padding-top:15px}.hero{padding-top:15px}}
@media(min-width:761px) and (max-width:960px){.tools{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand"><div class="logo">TV</div><span>TinVin AI</span></div>
  <select id="uiLanguage" aria-label="Interface language"></select>
</header>

<section class="hero">
  <div class="eyebrow" id="eyebrow">YOUR SMART WORKSPACE</div>
  <h1 id="headline">Think bigger. Create smarter.</h1>
  <p id="intro">Seven AI tools in one workspace. Write, learn, translate, plan, brainstorm, chat, and create images.</p>
</section>

<section class="tools" id="tools"></section>

<section class="panel">
  <div class="panel-head">
    <h2 id="workspaceTitle">AI Writer</h2>
    <span class="pill" id="toolPill">7 AI TOOLS</span>
  </div>

  <div id="standardFields">
    <label id="promptLabel" for="prompt">What would you like to create?</label>
    <textarea id="prompt" placeholder="Describe what you need..."></textarea>
  </div>

  <div id="translateFields" class="hidden">
    <label id="textLabel" for="translateText">Text to translate</label>
    <textarea id="translateText" placeholder="Enter text to translate..."></textarea>
    <div class="grid2">
      <div><label id="sourceLabel" for="sourceLanguage">From</label><select id="sourceLanguage"></select></div>
      <div><label id="targetLabel" for="targetLanguage">To</label><select id="targetLanguage"></select></div>
    </div>
  </div>

  <div id="outputLanguageWrap">
    <label id="outputLanguageLabel" for="outputLanguage">Answer language</label>
    <select id="outputLanguage"></select>
  </div>

  <div class="btns">
    <button class="primary" id="runButton">Generate</button>
    <button class="secondary" id="clearButton">Clear</button>
  </div>

  <div class="status" id="status" role="status"></div>

  <div class="result">
    <div class="result-top">
      <h3 id="resultTitle">Result</h3>
      <div class="btns" style="margin:0">
        <button class="secondary" id="copyButton">Copy</button>
        <button class="secondary hidden" id="downloadButton">Download image</button>
      </div>
    </div>
    <div class="output" id="output" aria-live="polite"></div>
    <img id="imageResult" class="image-result" alt="Generated image">
  </div>
</section>
<div class="foot">TinVin AI · Smart tools for everyone</div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';

const API_BASE = 'https://tinvin-ai-server.aslan89aslan1.workers.dev';

const languages = [
  {code:'en',name:'English'},
  {code:'ku',name:'Kurdish (Sorani)'},
  {code:'kmr',name:'Kurdish (Kurmanji)'},
  {code:'ar',name:'Arabic'},
  {code:'es',name:'Spanish'},
  {code:'pt',name:'Portuguese'},
  {code:'de',name:'German'},
  {code:'fr',name:'French'},
  {code:'it',name:'Italian'},
  {code:'tr',name:'Turkish'},
  {code:'fa',name:'Persian'},
  {code:'ru',name:'Russian'},
  {code:'zh',name:'Chinese (Simplified)'},
  {code:'ja',name:'Japanese'},
  {code:'ko',name:'Korean'},
  {code:'nl',name:'Dutch'},
  {code:'hi',name:'Hindi'},
  {code:'ur',name:'Urdu'},
  {code:'uk',name:'Ukrainian'},
  {code:'pl',name:'Polish'}
];

const tools = [
  {id:'writer',icon:'✍️',name:'AI Writer',desc:'Posts, emails and more',label:'What would you like to write?',placeholder:'Tell me what you want to write, and include any details or tone...'},
  {id:'chat',icon:'💬',name:'AI Chat',desc:'Ask questions and explore',label:'What would you like to ask?',placeholder:'Ask a question or explain what you need help with...'},
  {id:'translate',icon:'🌐',name:'AI Translator',desc:'Translate between languages',label:'Text to translate',placeholder:'Enter the text you want translated...'},
  {id:'business',icon:'📈',name:'Business Studio',desc:'Plans, marketing and growth',label:'What business task do you need?',placeholder:'Describe your business, audience, and goal...'},
  {id:'study',icon:'🎓',name:'Study Assistant',desc:'Learn difficult topics',label:'What would you like to learn?',placeholder:'Enter a topic or question. Ask for a simple explanation...'},
  {id:'ideas',icon:'💡',name:'Idea Generator',desc:'Fresh ideas and inspiration',label:'What do you need ideas for?',placeholder:'Describe the topic, goal, audience, or problem...'},
  {id:'image',icon:'🎨',name:'Image Generator',desc:'Create images from text',label:'Describe the image',placeholder:'Describe the scene, style, colors, and details you want...'}
];

const en = {
  eyebrow:'YOUR SMART WORKSPACE',
  headline:'Think bigger. Create smarter.',
  intro:'Seven AI tools in one workspace. Write, learn, translate, plan, brainstorm, chat, and create images.',
  workspaceTitle:'AI Writer',
  toolPill:'7 AI TOOLS',
  promptLabel:'What would you like to create?',
  promptPlaceholder:'Describe what you need...',
  textLabel:'Text to translate',
  sourceLabel:'From',
  targetLabel:'To',
  outputLanguageLabel:'Answer language',
  runButton:'Generate',
  clearButton:'Clear',
  resultTitle:'Result',
  copyButton:'Copy',
  downloadButton:'Download image',
  ready:'Ready',
  working:'Working on it…',
  empty:'Please enter some text first.',
  copied:'Copied to clipboard.',
  toastTranslation:'Interface translation failed. English is shown.'
};

const $ = id => document.getElementById(id);
let activeTool = 'writer';
let uiLang = 'en';
let uiText = {...en};
let imageUrl = '';
let uiTranslationRequest = 0;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

function languageName(code) {
  return languages.find(l => l.code === code)?.name || 'English';
}

function fillSelect(el, selected) {
  el.innerHTML = languages.map(l =>
    `<option value="${escapeHtml(l.name)}" data-code="${escapeHtml(l.code)}">${escapeHtml(l.name)}</option>`
  ).join('');
  if (selected) el.value = selected;
}

function showToast(message) {
  $('toast').textContent = message;
  $('toast').style.display = 'block';
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => $('toast').style.display = 'none', 3000);
}

function currentTool() {
  return tools.find(t => t.id === activeTool) || tools[0];
}

function renderTools() {
  $('tools').innerHTML = tools.map(t => `
    <button class="tool ${t.id === activeTool ? 'active' : ''}" data-tool="${t.id}">
      <div class="ico">${t.icon}</div>
      <strong>${escapeHtml(t.name)}</strong>
      <small>${escapeHtml(t.desc)}</small>
    </button>`).join('');

  document.querySelectorAll('[data-tool]').forEach(button => {
    button.addEventListener('click', () => selectTool(button.dataset.tool));
  });
}

function selectTool(id) {
  activeTool = id;
  renderTools();
  const t = currentTool();

  $('workspaceTitle').textContent = t.name;
  $('promptLabel').textContent = t.label;
  $('prompt').placeholder = t.placeholder;

  $('standardFields').classList.toggle('hidden', id === 'translate');
  $('translateFields').classList.toggle('hidden', id !== 'translate');
  $('outputLanguageWrap').classList.toggle('hidden', id === 'translate' || id === 'image');
  $('downloadButton').classList.toggle('hidden', id !== 'image');

  $('status').textContent = '';
  $('output').textContent = '';

  if (id === 'translate') {
    $('textLabel').textContent = t.label;
    $('translateText').placeholder = t.placeholder;
  }
}

async function requestJson(path, body, timeoutMs = 45000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);

  try {
    const response = await fetch(API_BASE + path, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),
      signal:controller.signal
    });

    const data = await response.json().catch(() => ({}));

    if (!response.ok || data.ok === false) {
      throw new Error(data.error || `Request failed (${response.status})`);
    }

    return data;
  } finally {
    clearTimeout(timer);
  }
}

function applyUI() {
  const ids = [
    'eyebrow','headline','intro','workspaceTitle','toolPill',
    'promptLabel','textLabel','sourceLabel','targetLabel',
    'outputLanguageLabel','runButton','clearButton','resultTitle',
    'copyButton','downloadButton'
  ];

  ids.forEach(id => {
    if ($(id) && uiText[id]) $(id).textContent = uiText[id];
  });

  $('prompt').placeholder = uiText.promptPlaceholder || en.promptPlaceholder;

  document.documentElement.lang = uiLang;
  document.documentElement.dir =
    ['ku','ar','fa','ur'].includes(uiLang) ? 'rtl' : 'ltr';

  // Keep the selected tool's own labels after applying interface translations.
  const t = currentTool();
  $('workspaceTitle').textContent = t.name;
  $('promptLabel').textContent = t.label;
  $('prompt').placeholder = t.placeholder;

  if (activeTool === 'translate') {
    $('textLabel').textContent = t.label;
    $('translateText').placeholder = t.placeholder;
  }
}

/*
  The current Worker has /api/ai but does not have /api/ui-translate.
  Therefore this function uses the existing /api/ai endpoint to translate
  the interface labels. If translation fails, the app remains usable in English.
*/
async function translateUI(languageCode) {
  const requestId = ++uiTranslationRequest;

  if (languageCode === 'en') {
    uiText = {...en};
    applyUI();
    return;
  }

  const language = languageName(languageCode);
  const cacheKey = 'tinvin_ui_translation_v6_' + languageCode;

  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed && typeof parsed === 'object') {
        uiText = {...en, ...parsed};
        if (requestId === uiTranslationRequest) applyUI();
        return;
      }
    }
  } catch (_) {}

  const labels = {
    eyebrow:en.eyebrow,
    headline:en.headline,
    intro:en.intro,
    workspaceTitle:en.workspaceTitle,
    toolPill:en.toolPill,
    promptLabel:en.promptLabel,
    promptPlaceholder:en.promptPlaceholder,
    textLabel:en.textLabel,
    sourceLabel:en.sourceLabel,
    targetLabel:en.targetLabel,
    outputLanguageLabel:en.outputLanguageLabel,
    runButton:en.runButton,
    clearButton:en.clearButton,
    resultTitle:en.resultTitle,
    copyButton:en.copyButton,
    downloadButton:en.downloadButton,
    ready:en.ready,
    working:en.working,
    empty:en.empty,
    copied:en.copied
  };

  try {
    const data = await requestJson('/api/ai', {
      tool:'chat',
      prompt:
        'Translate every string value in the following JSON object into ' +
        language + '. Return ONLY a valid JSON object with exactly the same keys. ' +
        'Do not add markdown fences or explanations. Preserve the meaning. ' +
        'For Kurdish Sorani, use natural Iraqi Kurdish Sorani in Arabic-based script, not Arabic or Latin transliteration.\n\n' +
        JSON.stringify(labels)
    }, 45000);

    if (requestId !== uiTranslationRequest) return;

    let raw = String(data.result || data.answer || data.text || '').trim();
    raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');

    const start = raw.indexOf('{');
    const end = raw.lastIndexOf('}');
    if (start < 0 || end <= start) throw new Error('Invalid interface translation.');

    const translated = JSON.parse(raw.slice(start, end + 1));
    uiText = {...en, ...translated};
    applyUI();

    try {
      localStorage.setItem(cacheKey, JSON.stringify(translated));
    } catch (_) {}
  } catch (error) {
    if (requestId !== uiTranslationRequest) return;
    uiText = {...en};
    applyUI();
    showToast('Interface translation failed. English is shown.');
    console.warn('TinVin interface translation failed:', error);
  }
}

async function runTool() {
  const isTranslate = activeTool === 'translate';
  const isImage = activeTool === 'image';
  const prompt = (isTranslate ? $('translateText').value : $('prompt').value).trim();

  if (!prompt) {
    showToast(uiText.empty || en.empty);
    return;
  }

  $('runButton').disabled = true;
  $('status').textContent = uiText.working || 'Working on it…';
  $('output').textContent = '';
  $('imageResult').style.display = 'none';
  $('downloadButton').classList.toggle('hidden', !isImage);
  imageUrl = '';

  try {
    if (isImage) {
      const data = await requestJson('/api/image', {prompt}, 60000);

      if (data.image) {
        imageUrl = 'data:' + (data.mimeType || 'image/jpeg') + ';base64,' + data.image;
      } else if (data.url) {
        imageUrl = data.url;
      } else {
        throw new Error(data.error || 'No image was returned.');
      }

      $('imageResult').onerror = () => {
        $('status').textContent = 'The server returned an image that could not be displayed.';
      };
      $('imageResult').src = imageUrl;
      $('imageResult').style.display = 'block';
      $('downloadButton').classList.remove('hidden');
      $('status').textContent = 'Image created.';
    } else if (isTranslate) {
      const target = $('targetLanguage').value;
      const source = $('sourceLanguage').value;

      const data = await requestJson('/api/ai', {
        tool:'translate',
        text:prompt,
        sourceLanguage:source === 'Auto-detect' ? 'Auto-detect' : source,
        targetLanguage:target
      }, 60000);

      $('output').textContent = data.result || data.answer || data.text || data.translation || '';
    } else {
      const outputLanguage = $('outputLanguage').value || languageName(uiLang);
      const data = await requestJson('/api/ai', {
        tool:activeTool,
        prompt:
          'Please answer in ' + outputLanguage + '.\n\n' + prompt,
        text:prompt
      }, 60000);

      $('output').textContent = data.result || data.answer || data.text || '';
    }

    if (!isImage && !$('output').textContent.trim()) {
      throw new Error('The AI returned an empty answer.');
    }

    if (!isImage) $('status').textContent = uiText.ready || 'Ready';
  } catch (error) {
    const message = error.name === 'AbortError'
      ? 'This request took too long. Please try again.'
      : (error.message || 'Something went wrong. Please try again.');

    $('status').textContent = message;
    showToast(message);
    console.error('TinVin AI request failed:', error);
  } finally {
    $('runButton').disabled = false;
  }
}

$('runButton').addEventListener('click', runTool);

$('clearButton').addEventListener('click', () => {
  $('prompt').value = '';
  $('translateText').value = '';
  $('output').textContent = '';
  $('imageResult').removeAttribute('src');
  $('imageResult').style.display = 'none';
  $('status').textContent = '';
  imageUrl = '';
});

$('copyButton').addEventListener('click', async () => {
  const text = $('output').textContent;
  if (!text) return showToast('Nothing to copy yet.');

  try {
    await navigator.clipboard.writeText(text);
    showToast(uiText.copied || 'Copied to clipboard.');
  } catch (_) {
    showToast('Copy is not available in this browser. Select the result and copy it.');
  }
});

$('downloadButton').addEventListener('click', async () => {
  if (!imageUrl) return;

  try {
    const response = await fetch(imageUrl);
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tinvin-ai-image.jpg';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (_) {
    window.open(imageUrl, '_blank', 'noopener');
  }
});

fillSelect($('uiLanguage'), 'English');
fillSelect($('sourceLanguage'), 'English');
fillSelect($('targetLanguage'), 'Kurdish (Sorani)');
fillSelect($('outputLanguage'), 'English');

$('sourceLanguage').insertAdjacentHTML(
  'afterbegin',
  '<option value="Auto-detect">Auto-detect</option>'
);
$('sourceLanguage').value = 'Auto-detect';

$('uiLanguage').addEventListener('change', async event => {
  uiLang = languages.find(l => l.name === event.target.value)?.code || 'en';
  await translateUI(uiLang);
});

renderTools();
selectTool('writer');
translateUI('en');
})();
</script>
</body>
</html>
